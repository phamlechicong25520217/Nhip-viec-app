<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Nhịp Việc: ghi chú, lên danh sách việc theo ưu tiên, tự chia lịch có giờ nghỉ để không quá tải.">
<meta name="theme-color" content="#1E7A5A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151F1C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nhịp Việc">
<meta property="og:title" content="Nhịp Việc">
<meta property="og:description" content="Ghi chú và lên lịch công việc tự động, có giờ nghỉ, lịch năm/tháng/ngày, nhạc nền và hình động.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nhịp Việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: sidebar rail on desktop, bottom tab bar on phone; one working canvas per view. Palette: pine green for focus, amber for rest. */
:root{
  --bg:#ECF0EE; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#15201C; --muted:#5C6A64; --line:#D8E0DC;
  --accent:#1E7A5A; --accent-ink:#FFFFFF; --accent-soft:#D7EDE3;
  --rest:#B97416; --rest-soft:#F6E8D2;
  --danger:#BE3B27; --danger-soft:#F8DDD6; --ok:#2B7A4B; --ok-soft:#DCEFE2;
  --shadow:0 1px 2px rgba(18,32,26,.06),0 6px 20px rgba(18,32,26,.07);
  --f-display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --ink:#E3ECE7; --muted:#93A49C; --line:#293732;
  --accent:#45C190; --accent-ink:#04140D; --accent-soft:#173A2D;
  --rest:#EAA94E; --rest-soft:#3A2B15;
  --danger:#F07C66; --danger-soft:#3E1F19; --ok:#62CC8C; --ok-soft:#173523;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --ink:#E3ECE7; --muted:#93A49C; --line:#293732;
  --accent:#45C190; --accent-ink:#04140D; --accent-soft:#173A2D;
  --rest:#EAA94E; --rest-soft:#3A2B15;
  --danger:#F07C66; --danger-soft:#3E1F19; --ok:#62CC8C; --ok-soft:#173523;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.01em}
.nav-btn{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;background:none;border-radius:10px;color:var(--muted);font-weight:600;text-align:left}
.nav-btn svg{width:20px;height:20px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav-btn[aria-current="page"] svg{color:var(--accent)}
.sync{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);margin-top:6px;flex:none}
.sync[data-mode="db"] i{background:var(--ok)}

main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:30px}
.page-head .sub{color:var(--muted);margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.rest{background:var(--rest);border-color:var(--rest);color:#1c1204}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:6px;width:34px;height:34px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .5s ease}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.pill.rest{background:var(--rest-soft);color:var(--rest)}
.pill.sample{background:var(--rest-soft);color:var(--rest)}

/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;min-height:210px;color:#fff;display:flex;align-items:flex-end;box-shadow:var(--shadow)}
.hero .scene{position:absolute;inset:0}
.hero-body{position:relative;width:100%;padding:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0))}
.hero h1{font-size:30px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.hero .hsub{opacity:.9;font-size:14px}
.hero-stat{min-width:220px;flex:1;max-width:340px}
.hero-stat .bar{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25);height:10px}
.hero-stat .bar>i{background:#fff}
.hero-stat .big{font-family:var(--f-display);font-size:26px;font-weight:800}
.scene{display:block;width:100%;height:100%;object-fit:cover;background:#0b1a22}
.scene-btn{position:absolute;top:12px;right:12px;z-index:2;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:600;backdrop-filter:blur(4px)}

.grid-2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

.alert{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--danger-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent)}
.alert svg{color:var(--danger);flex:none;width:20px;height:20px;margin-top:2px}
.alert.info{background:var(--rest-soft);border-color:color-mix(in srgb,var(--rest) 35%,transparent)}
.alert.info svg{color:var(--rest)}
.alert>div{flex:1 1 240px;min-width:0}
.alert b{display:block}
.alert ul{margin:4px 0 0;padding-left:18px}

/* focus timer */
.focus{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{font-family:var(--f-display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ring .t small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.focus-task{font-size:19px;font-weight:700;font-family:var(--f-display)}
.focus.resting .ring circle.fg{stroke:var(--rest)}
.rest-scene{height:120px;border-radius:12px;overflow:hidden;margin-top:12px;position:relative}
.select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;max-width:100%}

/* timeline list (today) */
.tl{display:flex;flex-direction:column;gap:6px}
.tl-item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--c,var(--accent))}
.tl-item.brk{background:transparent;border-left-color:var(--rest);border:1px dashed color-mix(in srgb,var(--rest) 45%,var(--line));border-left:4px solid var(--rest);padding-block:5px;font-size:13.5px;color:var(--muted)}
.tl-item.now{outline:2px solid var(--c,var(--accent));outline-offset:1px}
.tl-time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);font-weight:600}
.tl-title{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tasks */
.task-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 14px 10px;border-left:5px solid var(--c)}
.task.dragging{opacity:.5}
.task.drop-above{box-shadow:0 -3px 0 var(--accent)}
.handle{cursor:grab;color:var(--muted);padding:4px 2px;display:flex;flex-direction:column;gap:2px;border:0;background:none}
.rank{font-family:var(--f-display);font-weight:800;font-size:15px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink)}
.task-main{min-width:0;display:flex;flex-direction:column;gap:7px}
.task-title{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.task-note{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.task-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.task-actions .row{flex-wrap:nowrap;gap:4px}
.task.done{opacity:.7}
.task.done .task-title{text-decoration:line-through}
.moved-note{font-size:12.5px;color:var(--rest);font-weight:600}

/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav h2{font-size:20px;min-width:0;text-align:center}
.year{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.mini h3{font-size:14px;margin-bottom:6px;font-family:var(--f-body);font-weight:700;cursor:pointer}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10.5px;text-align:center}
.mini-grid span{aspect-ratio:1;display:grid;place-items:center;border-radius:4px;font-variant-numeric:tabular-nums;max-width:100%}
.mini-grid .wd{color:var(--muted);font-weight:600}
.mini-grid button{aspect-ratio:1;border:0;border-radius:4px;padding:0;font-size:10.5px;font-variant-numeric:tabular-nums;background:var(--lv,transparent);position:relative}
.mini-grid button.today{outline:1.5px solid var(--ink)}
.mini-grid button.dl::after{content:"";position:absolute;top:1px;right:1px;width:4px;height:4px;border-radius:50%;background:var(--danger)}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.month .wd{background:var(--surface-2);padding:8px;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.mcell{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;min-width:0}
.mcell:hover{background:var(--surface-2)}
.mcell.out{background:var(--surface-2);color:var(--muted)}
.mcell .d{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center}
.mcell.today .d b{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
.chip{display:block;font-size:11.5px;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.dl{background:var(--danger-soft);border-left-color:var(--danger);color:var(--danger);font-weight:600}
.more{font-size:11px;color:var(--muted)}

.day-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.dayline{position:relative;margin-left:52px;border-left:1px solid var(--line)}
.hr{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.hr span{position:absolute;left:-52px;top:-9px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:44px;text-align:right}
.blk{position:absolute;left:8px;right:4px;border-radius:8px;padding:4px 9px;font-size:13px;overflow:hidden;background:color-mix(in srgb,var(--c) 20%,var(--surface));border-left:4px solid var(--c)}
.blk b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.brk{background:repeating-linear-gradient(-45deg,var(--rest-soft) 0 6px,transparent 6px 12px);border-left-color:var(--rest);color:var(--rest);font-weight:600;font-size:12px;padding-block:1px}
.nowline{position:absolute;left:-4px;right:0;border-top:2px solid var(--danger)}
.nowline::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* notes */
.notes{columns:3 260px;column-gap:14px}
.note{break-inside:avoid;margin-bottom:14px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;width:100%;text-align:left}
.note h3{font-family:var(--f-body);font-size:15.5px;font-weight:700}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:220px;overflow:hidden}
.note small{color:var(--muted);font-size:12px}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}

.switch{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);border:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* settings */
.form{display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .fl{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;width:100%;min-width:0}
textarea.input{resize:vertical;min-height:80px}
.fields-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.scene-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.scene-opt{border:2px solid transparent;border-radius:12px;padding:0;overflow:hidden;background:var(--surface-2);text-align:left;display:flex;flex-direction:column}
.scene-opt .scene{height:76px}
.scene-opt span{padding:6px 9px;font-size:12.5px;font-weight:600}
.scene-opt[aria-pressed="true"]{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

/* modal, toast, ring overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,14,12,.5);display:grid;place-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:100%;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:22px;margin-bottom:14px}
.modal-foot{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.sound-banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);font-size:14px}

.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.week svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

const MONTHS = Array.from({ length: 12 }, (_, i) => `Tháng ${i + 1}`);

function monthView(p, d) {
  const y = d.getFullYear(), m = d.getMonth(), tk = todayKey();

function dayView(p, d) {
  const k = ymd(d), tk = todayKey(), s = state.settings;
  const d0 = toMin(s.dayStart), d1 = Math.max(toMin(s.dayEnd), d0 + 60);
  const scale = 1.05, Hpx = (d1 - d0) * scale;
  const blocks = k >= tk ? (p.days[k] || []) : [];
  const logged = Object.entries(state.log[k] || {});
  const dls = state.tasks.filter(t => t.deadline === k);
  let tl = `<div class="dayline" style="height:${Hpx + 10}px">`;
  for (let h = Math.ceil(d0 / 60) * 60; h <= d1; h += 60) tl += `<div class="hr" style="top:${(h - d0) * scale}px"><span>${fmtHM(h)}</span></div>`;
  blocks.forEach(b => {
    const top = (b.start - d0) * scale, h = Math.max(14, (b.end - b.start) * scale - 2);
    if (b.type === 'break') tl += `<div class="blk brk" style="top:${top}px;height:${h}px">${b.long ? 'Nghỉ dài' : 'Nghỉ'} ${b.end - b.start}p</div>`;
    else { const t = taskById(b.taskId); tl += `<div class="blk" style="--c:${t.color};top:${top}px;height:${h}px"><b>${esc(t.title)}</b><span class="muted num" style="font-size:12px">${fmtHM(b.start)}–${fmtHM(b.end)}</span></div>`; }
  });
  if (k === tk) { const nm = nowMin(); if (nm >= d0 && nm <= d1) tl += `<div class="nowline" style="top:${(nm - d0) * scale}px"></div>`; }
  tl += '</div>';
  const empty = !blocks.length ? `<div class="empty"><b>${k < tk ? 'Ngày đã qua' : !s.workDays.includes(d.getDay()) ? 'Ngày nghỉ' : 'Không có phiên nào'}</b>${k < tk ? 'Xem phần đã làm ở bên cạnh.' : 'Ngày này chưa có việc được xếp.'}</div>` : '';
  const side = `<div class="col">
    ${dls.length ? `<div class="card"><h2 style="font-size:16px;margin-bottom:8px">Hạn chót trong ngày</h2>${dls.map(t => `<div class="chip dl" style="font-size:13px;padding:4px 8px;margin-bottom:4px">${esc(t.title)}</div>`).join('')}</div>` : ''}
    <div class="card"><h2 style="font-size:16px;margin-bottom:8px">Đã làm</h2>${logged.length ? logged.map(([id, m]) => { const t = taskById(id); return `<div class="row" style="justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap"><span class="chip" style="--c:${t ? t.color : '#888'};font-size:13px">${esc(t ? t.title : 'Việc đã xoá')}</span><b class="num">${fmtShort(m)}</b></div>`; }).join('') : '<div class="muted">Chưa ghi nhận phút nào.</div>'}</div>
    ${blocks.length ? `<div class="card"><h2 style="font-size:16px;margin-bottom:8px">Kế hoạch</h2><div class="muted">${blocks.filter(b => b.type === 'work').length} phiên làm, ${blocks.filter(b => b.type === 'break').length} lần nghỉ, tổng ${fmtDur(blocks.filter(b => b.type === 'work').reduce((a, b) => a + b.end - b.start, 0))} làm việc.</div></div>` : ''}
  </div>`;
  return `<div class="day-wrap"><div>${empty}${blocks.length || k >= tk ? tl : ''}</div>${side}</div>`;
}

let lastMinute = '';
function tick() {
  if (!state) return;
  const now = new Date(), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`, tk = ymd(now);
  if (timer && timer.mode && !timer.paused) {

    document.title = `${fmtClock(left)} · ${timer.mode === 'rest' ? 'Nghỉ' : 'Tập trung'} – Nhịp Việc`;
    if (left <= 0) { if (timer.mode === 'work') finishWork(false); else finishRest(false); }
  } else if (document.title !== 'Nhịp Việc') document.title = 'Nhịp Việc';

}

let setTimer = null;
function onSettingInput(el) {
  const k = el.dataset.set; let v = el.value;
  if (el.type === 'number') { v = parseFloat(v); if (!isFinite(v)) return; if (el.dataset.scale) v = Math.round(v * +el.dataset.scale); v = Math.max(+el.min * (el.dataset.scale || 1) || 0, v); }

  state.settings[k] = v; invalidate();
  clearTimeout(setTimer); setTimer = setTimeout(() => { persist(); }, 400);
}
async function uploadCustom(file) {

    catch (e) { toast(e && e.code === 'too_large' ? 'Tệp quá lớn (tối đa 20 MB).' : e && e.code === 'unsupported_type' ? 'Định dạng chưa hỗ trợ. Dùng GIF, WebP, PNG, JPG, MP4 hoặc WebM.' : 'Tải lên chưa thành công, thử lại sau.'); return; }
  }

}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const nav = e.target.closest('.nav-btn'); if (nav) { go(nav.dataset.view); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const t = id && taskById(id);
  switch (act) {
    case 'go': go(b.dataset.v); break;
    case 'close-modal': closeModal(); break;
    case 'unlock-sound': audio(); playSound('soft'); setTimeout(render, 300); break;
    case 'add-task': taskForm(); break;
    case 'edit-task': taskForm(t); break;
    case 'del-task': closeModal(); confirmBox('Xoá công việc?', `“${t.title}” và thời gian đã ghi nhận sẽ bị xoá khỏi danh sách.`, 'Xoá', () => { state.tasks = state.tasks.filter(x => x.id !== id); invalidate(); persist(); render(); toast('Đã xoá.'); }); break;
    case 'move': {
      const act2 = state.tasks.filter(x => !x.completed); const i = act2.indexOf(t), j = i + (+b.dataset.dir);
      if (j < 0 || j >= act2.length) break;
      const a = state.tasks.indexOf(act2[i]), c = state.tasks.indexOf(act2[j]); [state.tasks[a], state.tasks[c]] = [state.tasks[c], state.tasks[a]];
      invalidate(); persist(); render(); break; }
    case 'complete': t.completed = true; t.completedAt = Date.now(); invalidate(); persist(); render(); toast(`Hoàn thành: ${t.title}`); break;
    case 'reopen': t.completed = false; if (t.done >= t.estimate) t.estimate = t.done + 30; invalidate(); persist(); render(); break;
    case 'log': logForm(t); break;
    case 'toggle-done': ui.showDone = !ui.showDone; render(); break;
    case 'clear-sample':
      state.tasks = state.tasks.filter(x => !x.sample); state.notes = state.notes.filter(x => !x.sample); state.alarms = [];
      ['s1', 's2', 's3', 's4', 's5'].forEach(sid => Object.values(state.log).forEach(d => delete d[sid]));
      invalidate(); persist(); render(); toast('Đã xoá dữ liệu mẫu. Giờ hãy thêm việc của bạn.'); break;
    case 'timer-start': startWork($('#focus-task').value, +$('#focus-len').value); break;
    case 'timer-start-block': startWork(id, +b.dataset.len); break;
    case 'timer-pause': timer.paused = true; timer.pausedLeft = Math.max(0, timer.endAt - Date.now()); saveTimer(); render(); break;
    case 'timer-resume': timer.paused = false; timer.endAt = Date.now() + timer.pausedLeft; saveTimer(); render(); break;
    case 'timer-stop': finishWork(true); break;
    case 'rest-skip': finishRest(true); break;
    case 'cal-mode': ui.calMode = b.dataset.m; render(); break;
    case 'cal-today': ui.calDate = new Date(); render(); break;
    case 'cal-step': { const n = +b.dataset.n, d = new Date(ui.calDate); if (ui.calMode === 'year') d.setFullYear(d.getFullYear() + n); else if (ui.calMode === 'month') { d.setDate(1); d.setMonth(d.getMonth() + n); } else d.setDate(d.getDate() + n); ui.calDate = d; render(); break; }
    case 'cal-goto': ui.calMode = b.dataset.mode; ui.calDate = parseYmd(b.dataset.d); render(); window.scrollTo(0, 0); break;
    case 'cal-day': ui.view = 'calendar'; ui.calMode = 'day'; ui.calDate = parseYmd(b.dataset.d); render(); window.scrollTo(0, 0); break;
    case 'add-note': noteForm(); break;
    case 'edit-note': noteForm(state.notes.find(n => n.id === id)); break;
    case 'del-note': closeModal(); state.notes = state.notes.filter(n => n.id !== id); persist(); render(); toast('Đã xoá ghi chú.'); break;
    case 'toggle-setting': state.settings[b.dataset.k] = !state.settings[b.dataset.k]; invalidate(); persist(); render(); break;
    case 'toggle-wd': { const x = +b.dataset.d, w = state.settings.workDays; state.settings.workDays = w.includes(x) ? w.filter(y => y !== x) : [...w, x]; if (!state.settings.workDays.length) { state.settings.workDays = [x]; toast('Cần ít nhất một ngày làm việc.'); } invalidate(); persist(); render(); break; }
    case 'preset-rhythm': { const [bl, br, lb, le] = b.dataset.r.split(',').map(Number); Object.assign(state.settings, { block: bl, brk: br, longBrk: lb, longEvery: le }); invalidate(); persist(); render(); toast(`Đã chuyển sang nhịp ${bl}/${br}.`); break; }
    case 'music-toggle': musicToggle(); break;
    case 'music-next': musicStep(1); break;
    case 'music-prev': musicPrev(); break;
    case 'music-play': if (id === music.curId) musicToggle(); else playTrack(id); break;
    case 'music-del': removeTrack(id); toast('Đã xoá khỏi danh sách phát.'); break;
    case 'music-move': moveTrack(id, +b.dataset.dir); break;
    case 'music-shuffle': state.settings.musicShuffle = !state.settings.musicShuffle; persist(); render(); break;
    case 'music-repeat': state.settings.musicRepeat = { all: 'one', one: 'off', off: 'all' }[state.settings.musicRepeat] || 'all'; persist(); render(); break;
    case 'install-app': if (window.__installEvt) { window.__installEvt.prompt(); window.__installEvt = null; render(); } break;
    case 'test-sound': audio(); playSound(state.settings.timerSound); break;
    case 'pick-scene': state.settings[b.dataset.k] = b.dataset.v; persist(); render(); break;
    case 'set-motion': state.settings.motion = b.dataset.m; persist(); render(); break;
    case 'remove-custom': state.settings.custom = null; lsSet(LS_MEDIA, null); ['sceneHome', 'sceneRest'].forEach(k => { if (state.settings[k] === 'custom') state.settings[k] = DEFAULT_SETTINGS[k]; }); persist(); render(); break;
    case 'copy-json': { const txt = JSON.stringify(dbPayload()); try { await navigator.clipboard.writeText(txt); toast('Đã sao chép bản sao lưu. Dán vào ghi chú hoặc tệp để giữ lại.'); } catch { openModal(`<h2>Bản sao lưu</h2><p class="muted">Chọn toàn bộ và sao chép đoạn dưới đây.</p><textarea class="input" style="min-height:220px;font-size:12px" readonly>${esc(txt)}</textarea><div class="modal-foot"><span></span><button class="btn" data-act="close-modal">Đóng</button></div>`, m => { const ta = $('textarea', m); ta.focus(); ta.select(); }); } break; }
    case 'import-json': openModal(`<h2>Khôi phục dữ liệu</h2><p class="muted">Dán bản sao lưu JSON. Dữ liệu hiện tại sẽ bị thay thế.</p><textarea class="input" id="imp" style="min-height:200px;font-size:12px"></textarea><div id="imp-err" style="color:var(--danger)" hidden></div><div class="modal-foot"><span></span><div class="row"><button class="btn" data-act="close-modal">Huỷ</button><button class="btn primary" id="imp-ok">Khôi phục</button></div></div>`, m => { $('#imp-ok', m).addEventListener('click', () => { try { const d = JSON.parse($('#imp', m).value); if (!d || !Array.isArray(d.tasks)) throw 0; state = normalize(d); invalidate(); persist(); closeModal(); render(); toast('Đã khôi phục.'); } catch { const er = $('#imp-err', m); er.hidden = false; er.textContent = 'Nội dung không phải bản sao lưu hợp lệ của Nhịp Việc.'; } }); }); break;
    case 'reset-all': confirmBox('Xoá toàn bộ dữ liệu?', 'Mọi công việc, ghi chú và lịch sử làm việc sẽ bị xoá. Không thể hoàn tác.', 'Xoá tất cả', () => { const keep = state.settings; state = normalize({ settings: keep }); timer = null; saveTimer(); invalidate(); persist(); render(); toast('Đã xoá toàn bộ dữ liệu.'); }); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'seek') { const d = audioEl.duration; if (d) { audioEl.currentTime = +e.target.value / 1000 * d; musicProgress(); } return; }
  if (e.target.id === 'vol') { const v = +e.target.value / 100; audioEl.volume = v; state.settings.musicVol = v; clearTimeout(setTimer); setTimer = setTimeout(persist, 600); return; }
  if (e.target.id === 'note-q') { ui.noteQuery = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#note-q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch {} return; }
  if (e.target.matches('#view [data-set]') && e.target.tagName !== 'SELECT') onSettingInput(e.target);
});
document.addEventListener('change', e => {
  if (e.target.matches('#view [data-set]')) { if (e.target.tagName === 'SELECT') { state.settings[e.target.dataset.set] = e.target.value; persist(); render(); } else { onSettingInput(e.target); persist(); render(); } }
  if (e.target.id === 'st-up') uploadCustom(e.target.files[0]);
  if (e.target.id === 'music-up') { addTracks(e.target.files); e.target.value = ''; }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && timer && timer.mode === 'work' && !timer.paused) lockScreen(true); });

/* ---------- boot ---------- */
(async () => {
  let local = null; try { const raw = lsGet(LS_KEY); if (raw) local = normalize(JSON.parse(raw)); } catch {}
  if (local) { state = local; render(); }
  const remote = await storeInit();
  if (store.mode === 'db') {
    if (remote && (!local || (remote.updatedAt || 0) >= (local.updatedAt || 0))) state = normalize(remote);
    else if (local) { state = local; persist(); }
    else state = sampleState();
  } else if (!state) state = sampleState();
  invalidate(); render();
  musicInit();
  setInterval(tick, 1000); tick();
})();
})();
</script>

<script>
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installEvt = e; });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
